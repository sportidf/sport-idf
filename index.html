<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sport IDF</title>
<style>
body{font-family:system-ui;margin:0;background:#f5f7f4;color:#142018}header{background:#123d29;color:#fff;padding:18px}main{max-width:850px;margin:auto;padding:20px}.logo{font-size:24px;font-weight:900}.hero{padding:35px 0}.hero h1{font-size:42px;line-height:1.05;margin:0}.muted{color:#667168}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.btn{padding:13px 17px;border:0;border-radius:12px;font-weight:800;cursor:pointer}.primary{background:#1f7a4d;color:white}.white{background:white;border:1px solid #dfe5df}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.filters input,.filters select,.form input,.form select{padding:12px;border:1px solid #dfe5df;border-radius:10px;background:white}.filters input{flex:1;min-width:190px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:#fff;border:1px solid #dfe5df;border-radius:18px;padding:17px}.tag{color:#1f7a4d;background:#e5f3eb;padding:5px 9px;border-radius:99px;font-size:12px;font-weight:800}.card h3{margin:12px 0 8px}.bar{height:8px;background:#edf0ed;border-radius:99px;margin:12px 0}.bar span{display:block;height:100%;background:#1f7a4d;border-radius:99px}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.box{background:#fff;border-radius:20px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto}.form{display:grid;gap:11px}.close{float:right;border:0;border-radius:50%;padding:8px}.note{background:#eef7f1;padding:12px;border-radius:12px;font-size:14px}
</style></head>
<body><header><main style="padding:0"><div class="logo">Sport IDF</div></main></header>
<main><section class="hero"><h1>Crée ton groupe.<br>Rejoins-en un.</h1><p class="muted">Le sport près de chez toi en Île-de-France. Les groupes se remplissent automatiquement jusqu'au nombre souhaité.</p>
<div class="buttons"><button class="btn primary" onclick="openCreate()">+ Créer un groupe</button><button class="btn white" onclick="document.getElementById('listing').scrollIntoView({behavior:'smooth'})">Voir les groupes</button></div></section>
<section id="listing"><h2>Groupes disponibles</h2><div class="filters"><input id="q" placeholder="Ville ou activité" oninput="render()"><select id="a" onchange="render()"><option value="">Toutes les activités</option><option>HIIT</option><option>CrossFit</option><option>Renforcement</option><option>Pilates</option><option>Yoga</option><option>Boxe</option></select></div><div id="grid" class="grid"></div></section></main>
<div id="modal" class="modal"><div class="box"><button class="close" onclick="closeCreate()">✕</button><h2>Créer un groupe</h2><div class="note">Aucun budget n'est demandé. Le tarif sera communiqué quand un coach sera trouvé.</div><form class="form" onsubmit="create(event)">
<input id="name" required placeholder="Nom du groupe"><select id="activity" required><option value="">Activité</option><option>HIIT</option><option>CrossFit</option><option>Renforcement</option><option>Pilates</option><option>Yoga</option><option>Boxe</option></select>
<input id="city" required placeholder="Ville"><input id="place" required placeholder="Lieu"><input id="date" required type="date"><input id="time" required type="time"><input id="capacity" required type="number" min="2" max="50" value="10" placeholder="Nombre maximum"><input id="creator" required placeholder="Prénom"><button class="btn primary">Publier le groupe</button></form></div></div>
<script>
let groups=JSON.parse(localStorage.getItem('sportidf_groups')||'null')||[
{id:1,name:'HIIT Montfermeil',activity:'HIIT',city:'Montfermeil',place:'Parc Arboretum',date:'2026-10-03',time:'10:00',capacity:10,members:3},
{id:2,name:'Renforcement Chelles',activity:'Renforcement',city:'Chelles',place:'Parc du Souvenir',date:'2026-10-04',time:'10:30',capacity:8,members:5}
];
function save(){localStorage.setItem('sportidf_groups',JSON.stringify(groups))}
function render(){let q=document.getElementById('q').value.toLowerCase(),a=document.getElementById('a').value;let list=groups.filter(g=>(!q||(g.name+' '+g.city+' '+g.activity).toLowerCase().includes(q))&&(!a||g.activity==a));document.getElementById('grid').innerHTML=list.map(g=>{let full=g.members>=g.capacity;return `<article class="card"><span class="tag">${g.activity}</span><h3>${g.name}</h3><div class="muted">📍 ${g.city} · ${g.place}<br>📅 ${g.date} à ${g.time}</div><div class="bar"><span style="width:${Math.min(100,g.members/g.capacity*100)}%"></span></div><b>${g.members}/${g.capacity}</b> participants ${full?'🔒':''}<br><button class="btn ${full?'white':'primary'}" ${full?'disabled':''} onclick="join(${g.id})">${full?'Groupe complet':'Rejoindre'}</button></article>`}).join('')||'<p>Aucun groupe pour le moment.</p>'}
function join(id){let g=groups.find(x=>x.id==id);if(g.members<g.capacity){g.members++;save();render();if(g.members==g.capacity)alert('Groupe complet ! Les inscriptions sont fermées et le coach peut maintenant être recherché.');else alert('Tu as rejoint le groupe !')}}
function openCreate(){document.getElementById('modal').classList.add('open')}function closeCreate(){document.getElementById('modal').classList.remove('open')}
function create(e){e.preventDefault();groups.push({id:Date.now(),name:name.value,activity:activity.value,city:city.value,place:place.value,date:date.value,time:time.value,capacity:+capacity.value,members:1});save();e.target.reset();capacity.value=10;closeCreate();render();document.getElementById('listing').scrollIntoView({behavior:'smooth'})}
render();
</script></body></html>
